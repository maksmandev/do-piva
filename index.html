<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Do Piva</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Yeseva+One&subset=cyrillic&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    background: #1b120c;
    background-image:
      radial-gradient(ellipse at center, rgba(120, 72, 30, .35) 0%, rgba(0, 0, 0, 0) 60%),
      repeating-linear-gradient(90deg, rgba(255, 255, 255, .015) 0, rgba(255, 255, 255, .015) 2px, rgba(0, 0, 0, 0) 2px, rgba(0, 0, 0, 0) 14vw),
      linear-gradient(180deg, #24180f 0%, #140d08 100%);
    color: #f3e7cf;
    font-family: 'Yeseva One', Georgia, serif;
  }

  #stage {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    display: flex; align-items: center; justify-content: center;
  }

  /* mug: dimmed copy of the photo underneath, the real photo revealed from the bottom up */
  .mug { position: relative; height: 60vh; width: 51.5vh; margin-right: 6vw; }
  .mug img { position: absolute; left: 0; bottom: 0; width: 51.5vh; height: 60vh; }
  .mug .dim { opacity: .3; }
  #glow {
    position: absolute; left: -30%; top: -20%; width: 130%; height: 140%;
    background: radial-gradient(ellipse at center, rgba(246, 178, 27, .35) 0%, rgba(246, 178, 27, 0) 65%);
  }
  #pour {
    position: absolute; left: 0; right: 0; bottom: 0; height: 0;
    overflow: hidden;
  }
  /* wavy beer surface: a sliding wave mask on the top 1.6vh, solid below */
  #pour.wavy {
    -webkit-mask-image: url(wave.svg), linear-gradient(#000, #000);
    mask-image: url(wave.svg), linear-gradient(#000, #000);
    -webkit-mask-size: 51.5vh 1.6vh, 100% 100%;
    mask-size: 51.5vh 1.6vh, 100% 100%;
    -webkit-mask-repeat: repeat-x, no-repeat;
    mask-repeat: repeat-x, no-repeat;
    -webkit-mask-position: 0 0, 0 1.5vh;
    mask-position: 0 0, 0 1.5vh;
    -webkit-animation: wave 7s linear infinite;
    animation: wave 7s linear infinite;
  }
  @-webkit-keyframes wave {
    from { -webkit-mask-position: 0 0, 0 1.5vh; }
    to { -webkit-mask-position: 51.5vh 0, 0 1.5vh; }
  }
  @keyframes wave {
    from { -webkit-mask-position: 0 0, 0 1.5vh; mask-position: 0 0, 0 1.5vh; }
    to { -webkit-mask-position: 51.5vh 0, 0 1.5vh; mask-position: 51.5vh 0, 0 1.5vh; }
  }
  .bubble {
    position: absolute; bottom: 4vh;
    width: .8vh; height: .8vh; border-radius: 50%;
    background: rgba(255, 250, 230, .75);
    -webkit-animation: rise linear infinite;
    animation: rise linear infinite;
  }
  @-webkit-keyframes rise {
    from { -webkit-transform: translateY(0); opacity: 0; }
    10% { opacity: 1; }
    to { -webkit-transform: translateY(-55vh); opacity: .6; }
  }
  @keyframes rise {
    from { transform: translateY(0); opacity: 0; }
    10% { opacity: 1; }
    to { transform: translateY(-55vh); opacity: .6; }
  }

  .info { display: flex; flex-direction: column; align-items: center; }

  .rule { margin: 0 0 1.5vh; color: #a5824a; font-size: 1.6vw; }
  .rule span { display: inline-block; width: 6vw; height: 2px; background: #a5824a; vertical-align: middle; margin: 0 1vw; }

  .label { font-size: 2vw; letter-spacing: .2em; color: #d9b878; }

  #clock { display: flex; margin-top: 4vh; }
  .unit { margin: 0 .6vw; text-align: center; }
  .unit .num {
    font-family: 'Yeseva One', Georgia, serif;
    font-size: 5vw; line-height: 1;
    min-width: 8vw; padding: .9vw .6vw;
    background: #2b1d12; color: #f6b21b;
    border: .15vw solid #a5824a; border-radius: .5vw;
    text-shadow: 0 0 1.5vw rgba(246, 178, 27, .45);
    box-shadow: inset 0 .3vw 0 rgba(255, 255, 255, .06), 0 .6vw 1.5vw rgba(0, 0, 0, .6);
  }
  .unit .cap { margin-top: .6vw; font-size: 1.2vw; letter-spacing: .15em; color: #a5824a; }

  #party {
    display: none;
    font-family: 'Yeseva One', Georgia, serif;
    font-size: 7vw; color: #f6b21b;
    text-shadow: 0 0 3vw rgba(246, 178, 27, .6);
  }

  /* sits over the glass body, left of the handle */
  #percent {
    position: absolute; left: 0; width: 70%; top: 50%; margin-top: -5vh;
    text-align: center; line-height: 10vh;
    font-family: 'Yeseva One', Georgia, serif; font-size: 10vh; color: #fffaf0;
    text-shadow: 0 0 .4vh #2b1d12, 0 .4vh 1.5vh rgba(0, 0, 0, .8), 0 0 3vh rgba(246, 178, 27, .5);
  }

  #tester {
    position: fixed; left: 50%; bottom: 4vh; z-index: 10;
    -webkit-transform: translateX(-50%); transform: translateX(-50%);
    display: none; align-items: center;
    padding: 12px 24px; border: 2px solid #a5824a; border-radius: 12px;
    background: rgba(43, 29, 18, .9); color: #d9b878; font-size: 20px;
  }
  #tester input { width: 40vw; margin: 0 16px; accent-color: #f6b21b; }
  #tester b { min-width: 3.5em; color: #f6b21b; }

  #hint {
    display: none;
    position: fixed; top: 24px; left: 50%; transform: translateX(-50%); z-index: 10;
    padding: 16px 32px; border: 3px solid #a5824a; border-radius: 12px;
    background: #2b1d12; color: #f3e7cf; font: 24px 'Yeseva One', Georgia, serif; cursor: pointer;
  }
  #hint:focus, #hint:hover { background: #f3e7cf; color: #2b1d12; outline: none; }
</style>
</head>
<body>
<div id="stage">
  <div class="mug">
    <div id="glow"></div>
    <img src="beer.png" alt="" class="dim">
    <div id="pour"><img src="beer.png" alt=""><div id="bubbles"></div></div>
    <div id="percent"></div>
  </div>

  <div class="info">
    <div class="rule"><span></span>❦<span></span></div>
    <div class="label" id="label">До пива залишилось</div>

    <div id="clock">
      <div class="unit"><div class="num" id="d">0</div><div class="cap">днів</div></div>
      <div class="unit"><div class="num" id="h">00</div><div class="cap">годин</div></div>
      <div class="unit"><div class="num" id="m">00</div><div class="cap">хвилин</div></div>
      <div class="unit"><div class="num" id="s">00</div><div class="cap">секунд</div></div>
    </div>
    <div id="party">NA ZDRAVÍ!</div>
  </div>
</div>

<div id="tester">Тиждень<input type="range" id="slider" min="0" max="100" step="1"><b id="slider-val"></b></div>
<button id="hint">⛶ На весь екран</button>
<script>
  const FRIDAY = 5, START_HOUR = 19, END_HOUR = 24;
  // Share of the image height above the foam top edge
  const GLASS_TOP = 0.02;
  const pad = n => (n < 10 ? '0' : '') + n;
  const $ = id => document.getElementById(id);

  // ?p=20 mocks the page at 20% of the week; ?test (or ?p) shows a slider to scrub through it
  const previewMatch = /[?&]p=(\d+)/.exec(location.search);
  const testMode = !!previewMatch || /[?&]test\b/.test(location.search);
  let preview = previewMatch ? Math.min(100, +previewMatch[1]) / 100 : null;

  // Bubbles stay within the glass body (left of the handle)
  for (let i = 0; i < 14; i++) {
    const b = document.createElement('span');
    const size = (0.4 + Math.random() * 0.8).toFixed(2) + 'vh';
    b.className = 'bubble';
    b.style.left = (12 + Math.random() * 46).toFixed(1) + '%';
    b.style.width = b.style.height = size;
    const dur = (4 + Math.random() * 5).toFixed(1) + 's', delay = (-Math.random() * 9).toFixed(1) + 's';
    b.style.webkitAnimationDuration = b.style.animationDuration = dur;
    b.style.webkitAnimationDelay = b.style.animationDelay = delay;
    $('bubbles').appendChild(b);
  }

  function setFill(progress) {
    const full = progress >= 1;
    const level = full ? 1 : progress * (1 - GLASS_TOP);
    const pour = $('pour');
    // Half the 1.6vh wave sits above the level, so the average surface stays on it
    pour.style.height = level > 0 && !full ? 'calc(' + (level * 100).toFixed(2) + '% + 0.8vh)' : (level * 100) + '%';
    pour.className = level > 0 && !full ? 'wavy' : '';
    $('glow').style.opacity = (0.25 + 0.75 * progress).toFixed(2);
  }

  // The week runs from the end of last Friday's session (midnight) to next Friday 19:00
  function weekBounds(now) {
    const next = new Date(now);
    next.setHours(START_HOUR, 0, 0, 0);
    next.setDate(now.getDate() + ((FRIDAY - now.getDay() + 7) % 7));
    if (next <= now) next.setDate(next.getDate() + 7);
    const start = new Date(next);
    start.setDate(next.getDate() - 6);
    start.setHours(0, 0, 0, 0);
    return { start: start, next: next };
  }

  // With ?p=N the clock is shifted to the moment of the week that is N% full, then keeps ticking
  let offset = 0;
  function mockAt(p) {
    preview = p;
    const w = weekBounds(new Date());
    offset = w.start.getTime() + p * (w.next - w.start) - Date.now();
  }
  if (preview !== null) mockAt(preview);

  function updateCountdown() {
    const now = new Date(Date.now() + offset);
    const party = now.getDay() === FRIDAY && now.getHours() >= START_HOUR && now.getHours() < END_HOUR;
    $('clock').style.display = party ? 'none' : '';
    $('party').style.display = party ? 'block' : 'none';
    $('label').style.display = party ? 'none' : '';

    if (party) {
      setFill(1);
      $('percent').textContent = '100%';
      return;
    }

    const w = weekBounds(now);
    const progress = Math.max(0, Math.min(1, (now - w.start) / (w.next - w.start)));
    setFill(progress);
    $('percent').textContent = Math.floor(progress * 100) + '%';

    let sec = Math.floor((w.next - now) / 1000);
    $('d').textContent = Math.floor(sec / 86400); sec %= 86400;
    $('h').textContent = pad(Math.floor(sec / 3600));
    $('m').textContent = pad(Math.floor(sec % 3600 / 60));
    $('s').textContent = pad(sec % 60);
  }
  updateCountdown();
  setInterval(updateCountdown, 1000);

  if (testMode) {
    const slider = $('slider');
    $('tester').style.display = 'flex';
    const w = weekBounds(new Date());
    const real = Math.max(0, Math.min(1, (Date.now() - w.start) / (w.next - w.start)));
    slider.value = Math.floor((preview !== null ? preview : real) * 100);
    $('slider-val').textContent = slider.value + '%';
    slider.addEventListener('input', () => {
      $('slider-val').textContent = slider.value + '%';
      mockAt(slider.value / 100);
      updateCountdown();
    });
  }

  const hint = document.getElementById('hint');
  // ?fs shows the fullscreen button (the F key works either way)
  const fsButton = /[?&]fs\b/.test(location.search);
  const el = document.documentElement;
  const fsElement = () => document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement;
  const request = el.requestFullscreen || el.webkitRequestFullscreen || el.webkitRequestFullScreen || el.mozRequestFullScreen || el.msRequestFullscreen;
  const exit = document.exitFullscreen || document.webkitExitFullscreen || document.mozCancelFullScreen || document.msExitFullscreen;
  let pseudo = false;

  function setMode(on) {
    document.body.style.cursor = on ? 'none' : '';
    if (fsButton) hint.style.display = on ? 'none' : 'block';
    if (testMode) $('tester').style.display = on ? 'none' : 'flex';
    if (!on && fsButton) hint.focus();
  }

  function enterPseudo() {
    pseudo = true;
    setMode(true);
  }

  function toggleFullscreen() {
    if (fsElement()) { exit && exit.call(document); return; }
    if (!request) { enterPseudo(); return; }
    try {
      const result = request.call(el);
      if (result && result.catch) result.catch(enterPseudo);
    } catch (e) { enterPseudo(); }
    // Some TV browsers accept the call but never switch, so hide the button anyway
    setTimeout(() => { if (!fsElement()) enterPseudo(); }, 700);
  }

  hint.addEventListener('click', toggleFullscreen);
  if (fsButton) {
    hint.style.display = 'block';
    hint.focus();
  }
  document.addEventListener('keydown', e => {
    if (e.key === 'f' || e.key === 'F') toggleFullscreen();
    else if (pseudo && (e.key === 'Escape' || e.key === 'Backspace' || e.key === 'GoBack' || e.keyCode === 461 || e.keyCode === 10009)) {
      e.preventDefault(); pseudo = false; setMode(false);
    }
  });
  ['fullscreenchange', 'webkitfullscreenchange', 'mozfullscreenchange', 'MSFullscreenChange'].forEach(ev =>
    document.addEventListener(ev, () => { pseudo = false; setMode(!!fsElement()); })
  );
</script>
</body>
</html>
